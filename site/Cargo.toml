[package]
name = "site"
version = "0.1.0"
edition = "2024"

[dependencies]
leptos = { version = "0.8.20", default-features = false }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Window",
    "Storage",
    "Document",
    "Element",
] }

[features]
csr = ["leptos/csr"]
hydrate = ["leptos/hydrate"]
ssr = ["leptos/ssr"]
